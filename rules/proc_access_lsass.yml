title: Process access to LSASS memory
id: sl-0010
status: stable
description: Handle to lsass.exe opened with rights used for memory reading.
tags: [attack.credential_access, attack.t1003.001]
logsource: {product: windows, category: process_access}
detection:
  target: {TargetImage|endswith: '\lsass.exe'}
  rights:
    GrantedAccess: ['0x1010', '0x1410', '0x1438', '0x143a', '0x1fffff']
  legit:
    SourceImage|endswith: ['\MsMpEng.exe', '\wininit.exe', '\csrss.exe', '\services.exe', '\svchost.exe']
  condition: target and rights and not legit
level: critical
