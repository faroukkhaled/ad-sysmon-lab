title: Very long DNS query name (possible tunnelling or DGA)
id: sl-0014
status: experimental
description: DNS queries with unusually long names.
tags: [attack.command_and_control, attack.t1071.004]
logsource: {product: windows, category: dns_query}
detection:
  long: {QueryName|re: '^[a-z0-9\-]{40,}\.'}
  condition: long
level: low
